
<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Studio 3.0</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

<style>
*{box-sizing:border-box}
body{margin:0;background:#10131c;color:#eee;font-family:Arial,sans-serif}
header{padding:16px;background:#191f2d;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h2{margin:0;color:#63d9a5}
main{max-width:1100px;margin:auto;padding:15px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button,.filebtn{border:0;border-radius:7px;padding:10px 14px;background:#293449;color:white;font-weight:bold;cursor:pointer}
button:hover,.filebtn:hover{filter:brightness(1.2)}
.run{background:#168b5b}
.stop{background:#b73545}
.editorbox{border:1px solid #394257;border-radius:8px;overflow:hidden}
.CodeMirror{height:48vh;font-size:14px}
h3{margin:18px 0 8px}
textarea{width:100%;background:#191f2d;color:#eee;border:1px solid #394257;border-radius:7px;padding:12px;resize:vertical}
#input{height:75px}
#terminal{height:190px;overflow:auto;background:#080b11;border:1px solid #394257;border-radius:7px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-family:monospace;color:#b9f6cf}
.status{color:#aebbd0;font-size:13px}
footer{text-align:center;color:#8290a5;padding:20px;font-size:12px}
input[type=file]{display:none}
</style>
</head>

<body>
<header>
  <h2>🐍 Python Studio 3.0</h2>
  <span class="status" id="status">Gati për Python 3</span>
</header>

<main>
  <div class="toolbar">
    <button class="run" id="runBtn" onclick="runCode()">▶ RUN</button>
    <button class="stop" onclick="stopCode()">■ STOP</button>
    <button onclick="saveProject()">💾 Ruaj projektin</button>
    <button onclick="openProject()">📂 Hap projektin</button>
    <button onclick="downloadCode()">⬇ Shkarko .py</button>
    <label class="filebtn" for="fileInput">📄 Importo .py</label>
    <input id="fileInput" type="file" accept=".py,.txt" onchange="importFile(event)">
    <button onclick="clearTerminal()">Pastro terminalin</button>
  </div>

  <div class="editorbox">
    <textarea id="editor">print("Përshëndetje nga Python Studio 3.0!")

for i in range(5):
    print("Python funksionon!", i + 1)
</textarea>
  </div>

  <h3>⌨️ Input për programin</h3>
  <textarea id="input" placeholder="Shkruaj këtu të dhënat që kërkon input()..."></textarea>

  <h3>Terminal</h3>
  <div id="terminal">Python Studio 3.0
Lidhja me serverin: gati
Shtyp RUN për të ekzekutuar kodin.
</div>
</main>

<footer>
Python Studio 3.0 · Powered by Python 3.14
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>

<script>
const API = "https://python-studio-3.onrender.com";

const editor = CodeMirror.fromTextArea(
  document.getElementById("editor"),
  {
    mode: "python",
    theme: "dracula",
    lineNumbers: true,
    indentUnit: 4,
    tabSize: 4,
    lineWrapping: true,
    matchBrackets: true
  }
);

let controller = null;
let running = false;

const terminal = document.getElementById("terminal");
const statusText = document.getElementById("status");
const runBtn = document.getElementById("runBtn");

function printTerminal(text) {
  terminal.textContent += "\n" + text;
  terminal.scrollTop = terminal.scrollHeight;
}

function clearTerminal() {
  terminal.textContent = "Terminal u pastrua.\n";
}

async function runCode() {
  if (running) return;

  const code = editor.getValue();

  if (!code.trim()) {
    printTerminal("Gabim: Kodi është bosh.");
    return;
  }

  running = true;
  controller = new AbortController();

  runBtn.disabled = true;
  runBtn.textContent = "Duke ekzekutuar...";
  statusText.textContent = "Duke ekzekutuar Python 3...";
  printTerminal("\n>>> Ekzekutimi filloi...");

  const timeout = setTimeout(() => {
    if (controller) controller.abort();
  }, 45000);

  try {
    const response = await fetch(API + "/run", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        code: code,
        input: document.getElementById("input").value
      }),
      signal: controller.signal
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.detail || result.error || "Gabim në server.");
    }

    if (result.output) {
      printTerminal(result.output);
    }

    if (result.error) {
      printTerminal("ERROR:\n" + result.error);
    }

    if (!result.output && !result.error) {
      printTerminal("Programi përfundoi pa dalje.");
    }

    if (result.exit_code !== undefined && result.exit_code !== null) {
      printTerminal("Exit code: " + result.exit_code);
    }

    statusText.textContent = "Ekzekutimi përfundoi";

  } catch (error) {
    if (error.name === "AbortError") {
      printTerminal("Kërkesa u ndërpre ose kaloi afatin e pritjes.");
      statusText.textContent = "U ndërpre pritja";
    } else {
      printTerminal("Gabim: " + error.message);
      statusText.textContent = "Gabim në ekzekutim";
    }
  } finally {
    clearTimeout(timeout);
    running = false;
    controller = null;
    runBtn.disabled = false;
    runBtn.textContent = "▶ RUN";
  }
}

function stopCode() {
  if (controller) {
    controller.abort();
    printTerminal("\n>>> U kërkua ndërprerja.");
  }
}

function saveProject() {
  const name = prompt("Emri i projektit:", "Projekti im");

  if (!name) return;

  const projects = JSON.parse(
    localStorage.getItem("pythonStudioProjects") || "{}"
  );

  projects[name] = {
    code: editor.getValue(),
    input: document.getElementById("input").value,
    date: new Date().toISOString()
  };

  localStorage.setItem("pythonStudioProjects", JSON.stringify(projects));
  printTerminal("Projekti u ruajt: " + name);
}

function openProject() {
  const projects = JSON.parse(
    localStorage.getItem("pythonStudioProjects") || "{}"
  );

  const names = Object.keys(projects);

  if (!names.length) {
    alert("Nuk ka projekte të ruajtura.");
    return;
  }

  const name = prompt("Projektet:\n" + names.join("\n") + "\n\nShkruaj emrin:");

  if (!name || !projects[name]) return;

  editor.setValue(projects[name].code);
  document.getElementById("input").value = projects[name].input || "";
  printTerminal("U hap projekti: " + name);
}

function downloadCode() {
  const blob = new Blob([editor.getValue()], {
    type: "text/x-python;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "program.py";
  a.click();

  URL.revokeObjectURL(url);
}

function importFile(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    editor.setValue(reader.result);
    printTerminal("U importua skedari: " + file.name);
  };

  reader.readAsText(file);
  event.target.value = "";
}
</script>
</body>
</html>
